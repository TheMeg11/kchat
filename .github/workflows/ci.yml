name: Tests and reproducible panel
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python -m pip install pytest==9.2.0 pytest-asyncio==1.5.0
      - run: python -m pip check
      - run: python -m pytest tests/ -q
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: hamchat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hamchat_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python -m pip install pytest==9.2.0 pytest-asyncio==1.5.0
      - run: python -m pytest tests/test_postgres.py -q
        env:
          TEST_PG_URL: postgresql+asyncpg://postgres:local-test-only@127.0.0.1:5432/hamchat_test
          BACKUP_PASSWORD: ci-only-backup-password-123456
  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:panel && npm run check:panel
      - run: git diff --exit-code -- webadmin/
      - run: npm audit --audit-level=high
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hamchat-ci .
